<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Convertix</title>
    <meta name="color-scheme" content="dark" />
    <!--
      GitHub Pages serves this file for any URL that is not a real file (for example a refresh on
      /convertix/converter). It sends the visitor to the app's index.html with the path in the query
      string; a small script in index.html then restores the original URL. Without it, refreshing any
      page except the home page would show a 404.
      Project sites (user.github.io/<repo>/) keep one path segment; custom domains keep none.
    -->
    <script>
      var keep = location.hostname.indexOf('.github.io') > -1 ? 1 : 0;
      var l = location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#020617"></body>
</html>
