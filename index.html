<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convertix — Image Conversion & Editing</title>
    <meta name="description" content="Convertix helps you convert, compress, edit, and watermark images, with useful PDF tools — all in your browser, no uploads." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Convertix — Image Conversion & Editing" />
    <meta property="og:description" content="Convert, compress, edit, and watermark images, with PDF and Word tools. 100% in your browser, no uploads." />
    <!-- Social crawlers need an absolute URL: after deploying, change this to https://<your-domain>/og-image.png -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Dark page + app-shell skeleton from the very first paint, so a refresh never flashes white. -->
    <link rel="stylesheet" href="/boot.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: the page paints immediately with a system font, then Inter swaps in. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <!-- React replaces everything inside #root as soon as the app starts. -->
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Convertix">
        <div class="boot-side" aria-hidden="true">
          <div class="boot-brand"><div class="b b-logo"></div><div class="b b-name"></div></div>
          <div class="b b-nav-first"></div>
          <div class="b b-nav"></div>
          <div class="b b-nav"></div>
          <div class="b b-nav"></div>
          <div class="b b-nav"></div>
        </div>
        <div class="boot-main">
          <div class="boot-head" aria-hidden="true">
            <div class="b b-search"></div><div class="b b-icon"></div><div class="b b-pill"></div>
          </div>
          <div class="boot-body" aria-hidden="true">
            <div class="boot-title">
              <div class="b b-chip"></div>
              <div class="boot-title-text"><div class="b b-h1"></div><div class="b b-sub"></div></div>
            </div>
            <div class="boot-grid">
              <div class="boot-panel"><div class="b b-label"></div><div class="b b-row"></div><div class="b b-row"></div></div>
              <div class="boot-panel"><div class="b b-label-sm"></div><div class="b b-field"></div><div class="b b-action"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <noscript><p>Convertix needs JavaScript to process your files in the browser.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
